
name: Build OpenUtau NEUTRINO for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout NEUTRINO branch
        uses: actions/checkout@v4
        with:
          repository: rokujyushi/OpenUtau
          ref: neutrino

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore OpenUtau -r win-x64

      - name: Publish Windows x64
        run: dotnet publish OpenUtau -c Release -r win-x64 --self-contained true -o bin/win-x64/

      - name: Add DirectML
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4" `
            -OutFile "DirectML.nupkg"
          New-Item -ItemType Directory -Force -Path "DirectML-package" | Out-Null
          tar -xf DirectML.nupkg -C DirectML-package
          Copy-Item "DirectML-package/bin/x64-win/DirectML.dll" "bin/win-x64/DirectML.dll"

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "bin/win-x64/*" `
            -DestinationPath "OpenUtau-NEUTRINO-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload compiled ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-NEUTRINO-win-x64
          path: OpenUtau-NEUTRINO-win-x64.zip
          if-no-files-found: error
          retention-days: 7
